server:
  port: 8080
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/attendance_db}
    username: ${DB_USERNAME:attendance}
    password: ${DB_PASSWORD:attendance}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
app:
  jwt:
    secret: ${JWT_SECRET:change-me-with-at-least-32-characters-long-secret}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:480}
  ai:
    base-url: ${AI_SERVICE_URL:http://localhost:8000}
